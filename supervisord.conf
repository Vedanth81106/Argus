[supervisord]
nodaemon=true
user=root

[program:spring]
command=java -jar /app/apps/orchestrator/target/orchestrator-0.0.1-SNAPSHOT.jar
directory=/app/apps/orchestrator
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python3 /app/apps/worker/main.py
directory=/app/apps/worker
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
# This starts the Next.js production server
command=npm start --prefix /app/apps/argus-frontend
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0