services:
  db:
    image: postgres:latest
    container_name: argus_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: argus_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d argus_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argus-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: argus_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL","rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argus-network

  spring:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    container_name: argus_spring
    ports:
      - "8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/argus_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PWD}
      CLERK_JWKS_URI: ${CLERK_JWKS_URI}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - argus-network

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: argus_worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASS: ${RABBIT_PWD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - argus-network

  frontend:
    build:
      context: ./apps/argus-frontend
      dockerfile: Dockerfile
    container_name: argus_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - spring
    networks:
      - argus-network

networks:
  argus-network:
    driver: bridge